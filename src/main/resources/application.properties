spring.application.name=activemq-simulator

# Keep Spring Boot 3 JSON defaults while using the Jackson 3 mapper.
spring.jackson.use-jackson2-defaults=true

simulator.activemq.broker-url=tcp://localhost:61616
simulator.activemq.username=artemis
simulator.activemq.password=artemis
simulator.activemq.topic=topic.cep.output.0
simulator.activemq.session-cache-size=100

simulator.task.max-history=10000

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.try-it-out-enabled=true

# Consolidated from application.yml; persistence and H2 console are excluded.
spring.threads.virtual.enabled=true
spring.mvc.pathmatch.matching-strategy=ant_path_matcher
server.port=8080

simulator.files.base-dir=./data
simulator.activemq.connect-timeout-ms=3000
simulator.message-log.sample-every=0

# Optional Artemis 2.44.0 broker. Off by default, including local.
simulator.embedded-broker.enabled=false
simulator.embedded-broker.use-as-default=true
simulator.embedded-broker.host=0.0.0.0
simulator.embedded-broker.core-port=61626
simulator.embedded-broker.stomp-port=61623
simulator.embedded-broker.username=artemis
simulator.embedded-broker.password=artemis
# 2 MiB: Artemis 64 KiB default rejects a single 1 MiB WebSocket frame.
simulator.embedded-broker.max-frame-bytes=2097152
simulator.embedded-broker.stomp-min-large-message-size=102400
simulator.embedded-broker.max-size-bytes=104857600
simulator.embedded-broker.address-full-policy=PAGE

simulator.subscribe.max-buffer=10000
simulator.subscribe.max-subscriptions=20
