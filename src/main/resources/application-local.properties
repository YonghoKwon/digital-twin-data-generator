simulator.http-logging.enabled=true
simulator.http-logging.include-request-body=true
simulator.http-logging.include-response-body=true
simulator.http-logging.max-payload-length=8000

logging.level.com.dt.digitaltwinsimulator=DEBUG

simulator.files.base-dir=c:/Project

# Enable explicitly when testing UE without an external broker.
simulator.embedded-broker.enabled=false

# Scenario track filePath still resolves under simulator.files.base-dir.
simulator.scenario.dir=c:/Project/scenarios
