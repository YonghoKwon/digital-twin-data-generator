<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>DT 시뮬레이터</title>
  <link rel="stylesheet" href="/ui/styles.css">
  <script type="module" src="/ui/app.js"></script>
</head>
<body>
  <a class="skip" href="#main">본문으로 이동</a>
  <header class="status-strip">
    <a class="brand" href="#/dashboard">DT 시뮬레이터</a>
    <div id="plant-status" class="plant-status" aria-label="운전 상태"></div>
    <div class="actions">
      <button id="commands" aria-keyshortcuts="Control+k">명령 <span class="key">Ctrl K</span></button>
      <button id="theme" aria-label="화면 테마 변경">시스템</button>
      <button id="stop-all" class="danger">전체 정지</button>
    </div>
  </header>
  <aside class="sidebar">
    <nav aria-label="주 메뉴">
      <a href="#/dashboard">개요 <span class="key">1</span></a>
      <a href="#/publish">보내기 <span class="key">2</span></a>
      <a href="#/streams">스트림 <span class="key">3</span></a>
      <a href="#/subscriptions">수신 <span class="key">4</span></a>
      <a href="#/mock">REST <span class="key">5</span></a>
      <a href="#/scenarios">시나리오 <span class="key">6</span></a>
      <a href="#/legacy">기존 <span class="key">7</span></a>
      <a class="swagger" href="/swagger" target="_blank" rel="noopener">Swagger</a>
    </nav>
    <button id="shortcuts">단축키 <span class="key">?</span></button>
  </aside>
  <main id="main" tabindex="-1"></main>
  <datalist id="known-topics"></datalist>
  <datalist id="known-message-ids"></datalist>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <noscript>DT 시뮬레이터를 사용하려면 JavaScript를 활성화하세요.</noscript>
</body>
</html>
